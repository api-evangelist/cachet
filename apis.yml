aid: cachet
name: Cachet
description: >-
  Cachet OÜ is an Estonian InsurTech that provides adaptive, usage-based insurance
  for digital platforms and their users across new mobility, gig work, and
  car-sharing. Digital platforms integrate Cachet through three inbound event
  APIs: the Parking API (car-sharing fleets stream vehicle events so Cachet
  manages parking), the Verify / Platform API (gig-work platforms register workers
  and push task events to drive worker protection), and the Partners API (embed a
  prefilled Cachet onboarding link into a partner app). All three are OpenAPI 3.1
  and authenticated with issued x-api-key and x-api-username headers. Cachet is
  backed by Techstars; notable platform clients include Bolt, Bird, Ryde, and
  TaskRabbit.
